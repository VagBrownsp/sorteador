<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio Vale Financeira</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🎁 Sorteio Vale Financeira</h1>

        <form id="formFicha">
            <label for="nome">Nome Completo *</label>
            <input type="text" id="nome" autocomplete="name" required>

            <label for="cargo">Cargo *</label>
            <input
                type="text"
                id="cargo"
                placeholder="Ex.: Analista, Gerente..."
                autocomplete="organization-title"
                required>

            <label for="celular">Celular *</label>
            <input
                type="text"
                id="celular"
                inputmode="numeric"
                maxlength="15"
                placeholder="(12) 99999-9999"
                autocomplete="tel"
                required>

            <button type="submit">Participar do Sorteio</button>
            <button id="sortearBtn" type="button">Sortear vencedor 🎲</button>
            <div id="resultadoSorteio"></div>
        </form>

        <div id="mensagem"></div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
